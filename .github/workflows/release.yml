name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: prime-asr-windows-amd64.exe
            bin: prime-asr.exe
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            asset: prime-asr-windows-arm64.exe
            bin: prime-asr.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: prime-asr-linux-amd64
            bin: prime-asr
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: prime-asr-linux-arm64
            bin: prime-asr
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Fetch pinned TinyASR models
        run: |
          curl -fL "https://raw.githubusercontent.com/dkaraush/tinyasr/e034289132667fa8e87dd8d474a4dc59d447b2dc/models/en-ru-uk.tzf.gz" -o dist/en-ru-uk.tzf.gz
          curl -fL "https://raw.githubusercontent.com/dkaraush/tinyasr/e034289132667fa8e87dd8d474a4dc59d447b2dc/models/silero_vad.onnx.gz" -o dist/silero_vad.onnx.gz
          cd dist
          sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
